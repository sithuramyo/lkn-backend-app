name: Pull Request Build & Test

on:
  pull_request:
    branches: [ development ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./src/LknBackendApp.API

      - name: Build
        run: dotnet build ./src/LknBackendApp.API --no-restore --configuration Release

      - name: Test
        run: dotnet test ./tests/LknBackendApp.UnitTests --no-restore --verbosity normal
